name: Build APK

# Runs every time you upload changes, and can also be started by hand
# from the "Actions" tab with the "Run workflow" button.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: YdarTrack-v4-apk
          path: app/build/outputs/apk/debug/app-debug.apk
