name: Build APK

# Runs every time you upload changes, and can also be started by hand
# from the "Actions" tab with the "Run workflow" button.
# Each build is published as a Release, so the APK can be downloaded
# straight to a phone from the repository's "Releases" page.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "YdarTrack-v$VERSION.apk"

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: YdarTrack-apk
          path: YdarTrack-v*.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "YdarTrack-v${VERSION}.apk" \
            --title "Ydar Track ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Install: open this page on your phone, tap the APK, then Install. Your data is kept when updating." \
            --latest
