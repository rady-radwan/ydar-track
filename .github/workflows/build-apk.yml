name: Build Android + Windows

# Runs every time you upload changes, and can also be started by hand
# from the "Actions" tab with the "Run workflow" button.
# Each build is published as a Release, so the APK can be downloaded
# straight to a phone from the repository's "Releases" page.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        run: base64 -d keystore/ydartrack.jks.b64 > keystore/ydartrack.jks

      - name: Build the app
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Check the Windows app compiles
        run: ./gradlew :desktop:compileKotlin --stacktrace 2>&1 | tee -a build.log

      - name: Test sync (engine + live Supabase)
        env:
          YDAR_LIVE_TEST: "1"
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Name the APK
        run: |
          VERSION="5.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "YdarTrack-v$VERSION.apk"

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: YdarTrack-apk
          path: YdarTrack-v*.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" "YdarTrack-v${VERSION}.apk" \
            --title "Ydar Track ${VERSION}" \
            --notes "Install: open this page on your phone, tap the APK, then Install. Your data is kept when updating." \
            --latest

      - name: Report build status
        if: always()
        run: |
          mkdir -p /tmp/report
          {
            echo "status: ${{ job.status }}"
            echo "sha: ${{ github.sha }}"
            echo "run: ${{ github.run_number }}"
            echo "==== errors ===="
            grep -E "^e: |error:|What went wrong|FAILED" -A4 build.log | head -400 || true
            echo "==== tests ===="
            grep -E "PASS|FAIL|passed|failed|pushed|pulled|wrong password|LIVE|Exception|expected" test.log | head -120 || true
            echo "==== tail ===="
            tail -80 build.log || true
          } > /tmp/report/status.txt
          cd /tmp/report
          git init -q
          git checkout -q -b ci-status
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI run ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-status

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the Windows installers
        shell: bash
        run: ./gradlew :desktop:packageMsi :desktop:packageExe --stacktrace 2>&1 | tee win.log

      - name: Add them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="5.0.${GITHUB_RUN_NUMBER}"
          cp desktop/build/compose/binaries/main/msi/*.msi "YdarTrack-Windows-v$V.msi"
          cp desktop/build/compose/binaries/main/exe/*.exe "YdarTrack-Windows-Setup-v$V.exe"
          gh release upload "v$V" "YdarTrack-Windows-v$V.msi" "YdarTrack-Windows-Setup-v$V.exe" --clobber

      - name: Report Windows build
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/wreport && cd /tmp/wreport
          { echo "status: ${{ job.status }}"; echo "run: ${{ github.run_number }}";
            grep -E "^e: |error:|What went wrong|FAILED|Exception" -A6 "$GITHUB_WORKSPACE/win.log" | head -200 || true
            echo "==== tail ===="; tail -60 "$GITHUB_WORKSPACE/win.log" || true; } > status.txt
          git init -q && git checkout -q -b ci-windows && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Windows run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-windows
